name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: motile
          POSTGRES_PASSWORD: motile
          POSTGRES_DB: motile
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U motile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://motile:motile@localhost:5435/motile
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The GPUI app is a Cargo workspace of its own, built against crates/core, for Linux and Windows.
  gpui:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/gpui
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gpui -> target
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  apple:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: packages/apple/scripts/check-ui.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r build
