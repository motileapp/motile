name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Debug info makes the builds slower and the caches bigger, and nothing here reads it.
env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: motile
          POSTGRES_PASSWORD: motile
          POSTGRES_DB: motile
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U motile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://motile:motile@localhost:5435/motile
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      # Only main saves its caches: the repository has 10 GB for them, and a pull request's would push main's out.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Every program of the corpus has the frames the clients are compared with (scripts/compare-frames.sh).
      - name: Check the frame references
        run: |
          cargo run -q -p motile-core --example compare_frames -- crates/core/fixtures/frames/mac crates/core/fixtures/frames/mac
          cargo run -q -p motile-core --example compare_frames -- crates/core/fixtures/frames/ios crates/core/fixtures/frames/ios --mobile

  # The GPUI app is a Cargo workspace of its own, built against crates/core, for Linux and Windows.
  # Its tests run on Linux, its pictures on Mesa's software Vulkan; Windows is only linted, which
  # checks the code only it compiles. On Linux the corpus's frames are compared with the Mac's
  # (crates/core/fixtures/frames), and they and the pictures are kept as an artifact.
  gpui:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/gpui
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev mesa-vulkan-drivers libvulkan1
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - run: scripts/patch-crates.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/gpui -> target
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test
      - name: Compare the frames with the Mac's
        if: runner.os == 'Linux'
        working-directory: .
        run: cargo run -q -p motile-core --example compare_frames -- crates/core/fixtures/frames/mac build/frames/gpui --known crates/core/fixtures/frames/known.txt
      - name: Lay the pictures side by side
        if: runner.os == 'Linux' && always()
        working-directory: .
        run: cargo run -q -p motile-core --example program_sheet -- build/programs/sheets
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: programs-gpui
          path: |
            build/frames/gpui
            build/programs
            build/canvas/gpui
          if-no-files-found: ignore

  apple:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: packages/apple/scripts/check-ui.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r build
