name: Image

# Builds the auth server's image and pushes it to ghcr.io/motileapp/motile-auth, which is what
# runs at motile.app.
on:
  push:
    branches: [main]
    paths:
      - apps/auth/**
      - crates/protocol/**
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/motileapp/motile-auth:latest
            ghcr.io/motileapp/motile-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
