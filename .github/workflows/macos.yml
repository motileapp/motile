name: macOS

# Builds the Mac app and the server for Macs, walks the client through a demo against a real auth server
# and a real server on the runner, and keeps the client, the server and the screenshots as artifacts.
# Builds the GPUI app for Macs beside it, which the release carries but motile.app doesn't offer, and
# lays the OpenUI corpus out on the Mac and on iOS, against the frames the other clients are held to.
# The release runs it on every push to main that touches them.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the client
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: scripts/release-version.sh

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          rustup update stable --no-self-update
          rustup default stable

      # First, because it is quick and says at once whether the Swift code is sound.
      - name: Compile the client
        working-directory: apps/macos
        run: swift build -c release --target Motile

      # A key of its own: the iOS workflow's job is called build too.
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac-app

      - name: Build the core, the server and the auth server
        run: cargo build --release -p motile-core -p motile-server -p motile-auth

      # Paints the core's canvas scenes and compares them with its reference pictures.
      - name: Test the Apple kit
        run: swift test --package-path packages/apple

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-apple
          path: build/canvas/apple
          if-no-files-found: ignore

      - name: Import the signing certificate
        if: inputs.sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: apps/macos/scripts/import-certificate.sh

      # Signed so that macOS keeps trusting it across updates. Nothing downloads it through a
      # browser, so it needs no notarization.
      - name: Sign the server
        if: inputs.sign
        run: codesign --force --timestamp --sign "$MOTILE_SIGN_IDENTITY" target/release/motile

      - name: Package the server
        run: tar -czf motile-aarch64-apple-darwin.tar.gz -C target/release motile

      - uses: actions/upload-artifact@v4
        with:
          name: server-aarch64-apple-darwin
          path: motile-aarch64-apple-darwin.tar.gz

      - name: Bundle the client
        run: apps/macos/scripts/build-app.sh

      - name: Demo
        run: apps/macos/scripts/ci-demo.sh

      - name: Notarize the client
        if: inputs.sign
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: apps/macos/scripts/notarize.sh apps/macos/build/Motile.app

      - name: Zip the client
        if: always()
        run: ditto -c -k --keepParent apps/macos/build/Motile.app Motile.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Motile
          path: Motile.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: apps/macos/screenshots

  # The corpus's frames on the Mac and in an iPhone simulator against crates/core/fixtures/frames,
  # which scripts/compare-frames.sh --bless writes, with their pictures side by side.
  programs:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: programs

      - name: Build the core for the Mac and the simulator
        run: |
          cargo build --release -p motile-core --example compare_frames --example program_sheet
          cargo build --release --target aarch64-apple-ios-sim -p motile-core

      - name: Lay the corpus out on the Mac
        run: swift test --package-path packages/apple --filter 'ProgramFramesTests|ProgramPicturesTests'

      - name: Lay the corpus out on iOS
        working-directory: packages/apple
        run: >-
          xcodebuild test -quiet -scheme MotileKit -destination 'platform=iOS Simulator,name=iPhone 17'
          -only-testing:MotileKitTests/ProgramFramesTests -only-testing:MotileKitTests/ProgramPicturesTests

      - name: Compare the frames with the references
        run: |
          target/release/examples/compare_frames crates/core/fixtures/frames/mac build/frames/mac --known crates/core/fixtures/frames/known.txt
          target/release/examples/compare_frames crates/core/fixtures/frames/ios build/frames/ios --mobile --known crates/core/fixtures/frames/known.txt

      - name: Lay the pictures side by side
        if: always()
        run: target/release/examples/program_sheet build/programs/sheets

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programs-apple
          path: |
            build/frames
            build/programs
          if-no-files-found: ignore

  gpui:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: scripts/release-version.sh

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gpui -> target

      - name: Import the signing certificate
        if: inputs.sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: apps/macos/scripts/import-certificate.sh

      - name: Bundle the client
        run: apps/gpui/scripts/build-app.sh

      - name: Notarize the client
        if: inputs.sign
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: apps/macos/scripts/notarize.sh "apps/gpui/build/Motile GPUI.app"

      - name: Zip the client
        run: ditto -c -k --keepParent "apps/gpui/build/Motile GPUI.app" Motile-GPUI-macos-aarch64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gpui-aarch64-apple-darwin
          path: Motile-GPUI-macos-aarch64.zip
