name: macOS

# Builds the Mac app and the server for Macs, walks the client through a demo against a real auth server
# and a real server on the runner, and keeps the client, the server and the screenshots as artifacts.
# The release runs it on every push to main that touches them.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the client
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: scripts/release-version.sh

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          rustup update stable --no-self-update
          rustup default stable

      # First, because it is quick and says at once whether the Swift code is sound.
      - name: Compile the client
        working-directory: apps/macos
        run: swift build -c release --target Motile

      - uses: Swatinem/rust-cache@v2

      - name: Build the core, the server and the auth server
        run: cargo build --release -p motile-core -p motile-server -p motile-auth

      - name: Import the signing certificate
        if: inputs.sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "MOTILE_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      # Signed so that macOS keeps trusting it across updates. Nothing downloads it through a
      # browser, so it needs no notarization.
      - name: Sign the server
        if: inputs.sign
        run: codesign --force --timestamp --sign "$MOTILE_SIGN_IDENTITY" target/release/motile

      - name: Package the server
        run: tar -czf motile-aarch64-apple-darwin.tar.gz -C target/release motile

      - uses: actions/upload-artifact@v4
        with:
          name: server-aarch64-apple-darwin
          path: motile-aarch64-apple-darwin.tar.gz

      - name: Bundle the client
        run: apps/macos/scripts/build-app.sh

      - name: Demo
        run: apps/macos/scripts/ci-demo.sh

      - name: Notarize the client
        if: inputs.sign
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/api-key.p8"
          CREDENTIALS=(--key "$RUNNER_TEMP/api-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          ditto -c -k --keepParent apps/macos/build/Motile.app "$RUNNER_TEMP/notarize.zip"
          SUBMISSION="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${CREDENTIALS[@]}" --wait --output-format json | jq -r .id)"
          xcrun notarytool log "$SUBMISSION" "${CREDENTIALS[@]}"
          xcrun stapler staple apps/macos/build/Motile.app
          spctl --assess --type execute --verbose apps/macos/build/Motile.app

      - name: Zip the client
        if: always()
        run: ditto -c -k --keepParent apps/macos/build/Motile.app Motile.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Motile
          path: Motile.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: apps/macos/screenshots
