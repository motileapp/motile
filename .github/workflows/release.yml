name: Release

# Builds the server and the auth server for Linux, the server, the client and the GPUI app for Macs,
# the GPUI app for Linux and Windows, and the Android app, and publishes them as a GitHub release, on every push to main that touches
# them. The version is the one scripts/release-version.sh gives the commit. The installer downloads the
# server from the latest release, and the download button on motile.app links to the clients in it. A
# newer push takes the place of a release that is still on its way.
on:
  push:
    branches: [main]
    paths:
      - apps/macos/**
      - apps/gpui/**
      - apps/android/**
      - packages/apple/**
      - crates/**
      - apps/server/**
      - apps/auth/**
      - scripts/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/release.yml
      - .github/workflows/macos.yml

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        run: scripts/release-version.sh
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup update stable --no-self-update && rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p motile-server -p motile-auth --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -czf motile-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release motile
          tar -czf motile-auth-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release motile-auth
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: "*.tar.gz"

  gpui:
    strategy:
      matrix:
        include:
          # The oldest Ubuntu runner, so that the GPUI app runs on systems with an older glibc too.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        run: scripts/release-version.sh
      - name: Toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gpui -> target
          key: ${{ matrix.target }}
      - name: Package
        run: apps/gpui/scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-${{ matrix.target }}
          path: apps/gpui/build/Motile-GPUI-*

  # Signed with the key every release shares, which the client checks an update against. Without
  # the key there is no Android release to carry.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          fetch-depth: 0
      - name: Version
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: scripts/release-version.sh
      - uses: actions/setup-java@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: 21
      - name: Toolchain
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-37.0" >/dev/null
      - uses: Swatinem/rust-cache@v2
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          key: android-release
      - uses: gradle/actions/setup-gradle@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
      - name: Build
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: apps/android/scripts/release.sh
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: android
          path: apps/android/build/release/Motile-android.apk

  macos:
    uses: ./.github/workflows/macos.yml
    with:
      sign: true
    secrets: inherit

  # The release is the latest one as soon as it exists, so it is made once, with every file.
  publish:
    needs: [linux, gpui, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(scripts/release-version.sh)"
          shopt -s nullglob
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes artifacts/*.tar.gz artifacts/*.zip artifacts/*.apk
