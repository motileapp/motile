name: Release

# Builds the server and the auth server for Linux, and the server and the client for Macs, and publishes
# them as a GitHub release, on every push to main that touches them. The version is the one
# scripts/release-version.sh gives the commit. The installer downloads the server from the latest
# release, and the download button on motile.app links to the client in it. A newer push takes the
# place of a release that is still on its way.
on:
  push:
    branches: [main]
    paths:
      - apps/macos/**
      - packages/apple/**
      - crates/**
      - apps/server/**
      - apps/auth/**
      - scripts/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/release.yml
      - .github/workflows/macos.yml

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        run: scripts/release-version.sh
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup update stable --no-self-update && rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p motile-server -p motile-auth --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -czf motile-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release motile
          tar -czf motile-auth-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release motile-auth
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: "*.tar.gz"

  macos:
    uses: ./.github/workflows/macos.yml
    with:
      sign: true
    secrets: inherit

  # The release is the latest one as soon as it exists, so it is made once, with every file.
  publish:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(scripts/release-version.sh)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes artifacts/*.tar.gz artifacts/Motile.zip
