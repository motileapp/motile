name: Android

# Lints, tests and builds the Android app on every push and pull request that touches it. The
# release workflow builds its release.
on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - crates/**
      - packages/theme/**
      - Cargo.lock
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/android/**
      - crates/**
      - packages/theme/**
      - Cargo.lock
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Toolchain
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-37.0" >/dev/null

      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the core
        run: MOTILE_ABIS=arm64-v8a,x86_64 scripts/build-core.sh

      - name: Lint and test
        run: ./gradlew -Pmotile.skipCore lintDebug testDebugUnitTest assembleDebug
