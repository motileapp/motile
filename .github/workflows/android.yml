name: Android

# Lints, tests and builds the Android app on every push and pull request that touches it. On main
# it also builds the release and uploads it to Google Play's internal testing track, once the
# repository has the ANDROID_* secrets and the PLAY_SERVICE_ACCOUNT one; without them the release
# is only built.
on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - crates/**
      - packages/theme/**
      - Cargo.lock
      - .github/workflows/android.yml
  pull_request:
    paths:
      - apps/android/**
      - crates/**
      - packages/theme/**
      - Cargo.lock
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Toolchain
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-37.0" >/dev/null

      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the core
        run: MOTILE_ABIS=arm64-v8a,x86_64 scripts/build-core.sh

      - name: Lint and test
        run: ./gradlew -Pmotile.skipCore lintDebug testDebugUnitTest assembleDebug

      - name: Build the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: scripts/release.sh

      - name: Upload to Google Play's internal testing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.PLAY_SERVICE_ACCOUNT != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: app.motile.android
          releaseFiles: apps/android/build/release/Motile.aab
          track: internal

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: android
          path: apps/android/build/release/*
