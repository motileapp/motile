[workspace]
resolver = "3"
members = ["apps/auth", "apps/server", "crates/protocol", "crates/core"]

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "MIT"
repository = "https://github.com/motileapp/motile"

[workspace.dependencies]
motile-protocol = { path = "crates/protocol" }
motile-core = { path = "crates/core" }
motile-server = { path = "apps/server" }
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
futures-lite = "2"
hex = "0.4"
iroh = "1.3"
libc = "0.2"
# No TLS provider of its own: `motile_protocol::tls::install` picks ring, the one iroh already uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
