# static-web-server, which serves the built site in production.

[general]
host = "0.0.0.0"
port = 3000
root = "/public"
page404 = "/public/404.html"
health = true
security-headers = true
# Set below instead: files with a hash in their name never change, the others may with any deploy.
cache-control-headers = false

[advanced]

[[advanced.headers]]
source = "**"
headers = { Cache-Control = "no-cache" }

[[advanced.headers]]
source = "/_astro/**"
headers = { Cache-Control = "public, max-age=31536000, immutable" }
