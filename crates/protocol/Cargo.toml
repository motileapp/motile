[package]
name = "motile-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The HTTP client for the auth server, used by the server and the client core.
auth-client = ["dep:reqwest", "dep:anyhow", "dep:rustls"]
# Following the account's relay with an iroh endpoint, for the server, the gateway and the core.
relay = ["dep:iroh", "tokio/sync", "tokio/rt"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex.workspace = true
sha2.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
unicode-normalization = "0.1"
ed25519-dalek = "2"
getrandom = "0.3"
tokio = { version = "1", features = ["io-util"] }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
