[package]
name = "motile-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The apps link the static library; the Rust tests and the host's tests use the rlib.
crate-type = ["rlib", "staticlib"]

[dependencies]
motile-protocol = { workspace = true, features = ["auth-client", "iroh"] }
anyhow.workspace = true
futures-lite.workspace = true
iroh.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
tempfile.workspace = true
