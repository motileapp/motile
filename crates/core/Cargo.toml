[package]
name = "motile-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The clients link the static library; the Rust tests and the server's tests use the rlib.
crate-type = ["rlib", "staticlib"]

[dependencies]
motile-protocol = { workspace = true, features = ["auth-client"] }
motile-openui.workspace = true
anyhow.workspace = true
base64.workspace = true
futures-lite.workspace = true
iroh.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
linkify = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
kurbo = "0.13"
svgtypes = "0.16"
ttf-parser = "0.25"
ratex-layout = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-types = "=0.1.15"

[dev-dependencies]
tempfile.workspace = true
# The reference renderer of canvas scenes, for the tests and `examples/canvas.rs` only.
tiny-skia = "0.12"
